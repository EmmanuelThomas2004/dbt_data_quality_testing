
version: 2

models:
  - name: dim_customers
    columns:
      - name: CUSTOMER_ID
        description: "The unique identifier for each customer."
        data_tests:
          - unique
          - not_null

  - name: stg_orders
    columns:
      - name: ORDER_STATUS
        description: "The status of the order."
        data_tests:
          - accepted_values:
              arguments:
                values: ['Pending', 'Shipped', 'Delivered', 'Cancelled']

  - name: fct_orders
    config:
      contract:
        enforced: true
    columns:
      - name: ORDER_ID
        data_type: number

      - name: CUSTOMER_ID
        data_type: number
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: CUSTOMER_ID
